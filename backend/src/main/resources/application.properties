spring.application.name=returntrail
server.address=127.0.0.1
server.port=8085

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

returntrail.graph.host=${FALKORDB_HOST:localhost}
returntrail.graph.port=${FALKORDB_PORT:6380}
returntrail.graph.name=${FALKORDB_GRAPH:returntrail_dev}

server.servlet.session.cookie.name=RTSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=2h