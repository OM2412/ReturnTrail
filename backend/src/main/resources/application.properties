spring.application.name=returntrail
server.address=127.0.0.1
server.port=8085

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

returntrail.graph.host=${FALKORDB_HOST:localhost}
returntrail.graph.port=${FALKORDB_PORT:6380}
returntrail.graph.name=${FALKORDB_GRAPH:returntrail_dev}

server.servlet.session.cookie.name=RTSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=2h
# Register one GitHub OAuth app for this origin. Secrets belong only in the backend environment.
returntrail.public-url=${RETURNTRAIL_PUBLIC_URL:http://127.0.0.1:5174}
returntrail.auth.github.enabled=${GITHUB_LOGIN_ENABLED:false}
returntrail.auth.github.client-id=${GITHUB_CLIENT_ID:}
returntrail.auth.github.client-secret=${GITHUB_CLIENT_SECRET:}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Saved account sign-in for ordinary shoppers; optional and disabled until configured.
returntrail.auth.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
returntrail.auth.google.client-id=${GOOGLE_CLIENT_ID:}
returntrail.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,falkorDb
