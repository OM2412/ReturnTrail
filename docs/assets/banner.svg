    <text x="59" y="59" font-size="12" font-weight="700" letter-spacing="1.6" fill="#272233">CONNECTED BY CONTEXT</text>
    <text x="44" y="137" font-size="68" font-weight="800" letter-spacing="-2.5" fill="#f8f5ff">ReturnTrail<tspan fill="#ffcea9">.</tspan></text>
    <text x="47" y="194" font-size="31" font-weight="700" fill="#dafa8b">Return drama? Follow the receipts.</text>
    <text x="47" y="237" font-size="18" fill="#d5cce3">Two records. One pickup. A clearer next question.</text>
    <text x="47" y="310" font-size="12" letter-spacing="1.5" fill="#bdb1cd">FALKORDB GRAPH CONTEXT  /  FICTIONAL PRACTICE CASES</text>
