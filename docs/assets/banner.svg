<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ReturnTrail — Return drama? Follow the receipts.</title>
  <desc id="desc">A dark plum and pastel banner connects two illustrated source documents to a parcel. This is a brand illustration, not a query result.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern></defs>
  <rect width="1200" height="360" rx="24" fill="#272233"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
